<!doctype html>
<html lang="fr">
  <head>
    <!-- Build compte (compte.restoclair.fr) : connexion, espace abonnement, mot de passe. Voir README, « Deux builds ».
     Aucun script ni style intégré : la CSP de cette origine reste script-src 'self' et style-src 'self', sans empreinte.
     Aucun referrer, aucune indexation. L'icône est ajoutée par compte/main.jsx (fichier du build, sous /assets/). -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mon abonnement RestOclair</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
